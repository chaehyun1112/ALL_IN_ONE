# PGH
spring.application.name=hospital-safety
spring.config.import=optional:file:./application-local.properties
server.port=8081
server.servlet.session.tracking-modes=cookie

# PostgreSQL
# DB 접속정보는 소스 코드에 직접 적지 않고 실행 환경의 환경변수로 전달한다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.aio.hospitalsafety.dto
mybatis.configuration.map-underscore-to-camel-case=true

# 메일 발송(아이디 찾기/비밀번호 재설정 인증코드). 백엔드 구현은 팀원이 별도로 진행 중이며,
# 설정만 남겨둔다. 메일 계정 정보도 DB와 마찬가지로 소스 코드에 직접 적지 않고 환경변수로 전달한다.
# 기본값(:뒤)은 메일 기능을 쓰지 않는 개발 환경에서도 앱이 정상 기동하도록 하기 위한 값이며,
# 값이 비어 있으면 실제 메일 발송 시점에만 실패하고 서버 시작에는 영향을 주지 않는다.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
