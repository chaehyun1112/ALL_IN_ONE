spring.application.name=hospital-safety
spring.config.import=optional:file:./application-local.properties
server.port=8081
server.servlet.session.tracking-modes=cookie

# PostgreSQL
# DB_URL은 호스트명, DB_JDBC_URL은 전체 JDBC URL 재정의용이다.
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://${DB_URL}:${DB_PORT:3310}/${DB_NAME:AIO}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.aio.hospitalsafety.dto
mybatis.configuration.map-underscore-to-camel-case=true

