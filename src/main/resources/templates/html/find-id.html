<!-- PGH -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>아이디 찾기 | 환자낙상예방</title>
  <link rel="stylesheet" th:href="@{/css/auth/password-reset.css}" href="../../static/css/auth/password-reset.css">
</head>
<body class="reset-body">
  <main class="reset-page">
    <section class="reset-content" aria-labelledby="hospital-name">
      <header class="reset-header">
        <p class="reset-eyebrow">AI 영상 기반</p>
        <h1 id="hospital-name">환자낙상예방</h1>
        <p class="reset-guide">아이디가 기억나지 않으시나요?</p>
      </header>

      <section class="reset-card" aria-labelledby="reset-title">
        <h2 id="reset-title">아이디 찾기</h2>
        <p class="reset-description">가입 시 등록한 이름과 이메일로 인증코드를 보내드립니다.</p>

        <div class="reset-field">
          <label for="employeeName">이름</label>
          <input id="employeeName" type="text" autocomplete="name"
                 placeholder="가입 시 등록한 이름을 입력해 주세요." maxlength="20">
        </div>

        <div class="reset-field">
          <label for="email">이메일</label>
          <div class="id-check-row">
            <input id="email" type="email" class="id-input" autocomplete="email"
                   placeholder="가입 시 등록한 이메일을 입력해 주세요." maxlength="100">
            <button type="button" id="sendCodeBtn" class="id-check-button">인증번호 발송</button>
          </div>
          <p id="emailMessage" class="id-check-message" role="status"></p>
        </div>

        <div class="reset-field" id="verifyCodeField" hidden>
          <label for="verifyCode">인증코드</label>
          <div class="id-check-row">
            <input id="verifyCode" type="text" inputmode="numeric" class="id-input"
                   maxlength="6" placeholder="6자리 숫자를 입력해 주세요.">
            <button type="button" id="checkCodeBtn" class="id-check-button">인증 확인</button>
            <span id="codeTimer" class="code-timer"></span>
          </div>
          <p id="codeMessage" class="id-check-message" role="status"></p>
        </div>

        <div class="reset-notice" id="resultBox" hidden>
          회원님의 아이디는 <strong id="resultUserId">-</strong> 입니다.
        </div>

        <p class="reset-detail">
          이름 또는 이메일이 기억나지 않으면 소속 병동 관리자에게 문의해 주세요.
        </p>
        <p class="reset-login"><a th:href="@{/login}" href="/login">로그인으로 돌아가기</a></p>
      </section>
    </section>
  </main>
  <script th:src="@{/JS/find-id/find-id-verify.js}"
          src="../../static/JS/find-id/find-id-verify.js"></script>
</body>
</html>
