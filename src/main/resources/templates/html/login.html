<!-- PGH -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>병원 로그인 | 환자낙상예방</title>
  <link rel="stylesheet" th:href="@{/css/auth/login.css}" href="../../static/css/auth/login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-content" aria-labelledby="service-name">
      <header class="service-intro">
        <p class="service-eyebrow">AI 영상 기반</p>
        <h1 id="service-name">환자낙상예방</h1>
        <p class="service-description">소속 병원의 구분 ID를 입력해 주세요.</p>
      </header>

      <!-- 로그인 1단계: TB_HOSPITAL에 등록된 병원인지 Controller가 조회한다. -->
      <form class="login-card hospital-card" th:action="@{/login/hospital}"
            th:object="${hospitalLoginForm}" method="post" novalidate>
        <p class="status success" th:if="${param.passwordChanged}" role="status">
          비밀번호가 변경되었습니다. 새 비밀번호로 로그인해 주세요.
        </p>
        <p class="status" th:if="${param.logout}" role="status">안전하게 로그아웃되었습니다.</p>
        <!-- 회원가입 완료 후 redirect:/login으로 넘어올 때 SignupController가 심어둔 안내 메시지. -->
        <p class="status success" th:if="${signupSuccessMessage != null}" th:text="${signupSuccessMessage}" role="status"></p>
        <div class="field">
          <label for="hospitalId">병원 구분 ID</label>
          <input id="hospitalId" th:field="*{hospitalId}" type="text"
                 placeholder="병원 구분 ID를 입력해 주세요" maxlength="30" autofocus required>
          <p class="status error" th:if="${#fields.hasErrors('hospitalId')}"
             th:errors="*{hospitalId}" role="alert"></p>
        </div>
        <button class="login-button" type="submit">다음</button>
        <!-- 회원가입은 병원 도메인 선택(/) 부터 시작하는 chae 흐름을 그대로 사용한다. -->
        <p class="signup-row">
          계정이 없으신가요?
          <a th:href="@{/}">회원가입</a>
        </p>
      </form>
    </section>
  </main>
</body>
</html>
