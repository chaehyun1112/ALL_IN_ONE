<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 | 늘푸른요양병원</title>
  <link rel="stylesheet" href="../static/signup.css" th:href="@{/signup.css}">
</head>
<body>
  <main class="signup-page">
    <section class="signup-card" aria-labelledby="signup-title">
      <header>
        <h1 id="signup-title">회원가입</h1>
        <p class="description">직원 정보를 입력해 계정을 생성해 주세요.</p>
      </header>
      <form action="/signup" th:action="@{/signup}" method="post">
        <div class="field name-field">
          <label for="name">이름</label>
          <input id="name" name="name" type="text" placeholder="이름을 입력해 주세요." autocomplete="name" required>
        </div>
        <div class="field username-field">
          <label for="username">아이디</label>
          <input id="username" name="username" type="text" placeholder="아이디를 입력하세요." autocomplete="username" required>
        </div>
        <div class="field password-field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" placeholder="영문, 숫자 포함 8자 이상" autocomplete="new-password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" title="영문과 숫자를 포함하여 8자 이상 입력해 주세요." required>
        </div>
        <div class="field confirm-field">
          <label for="password-confirm">비밀번호 확인</label>
          <input id="password-confirm" name="passwordConfirm" type="password" placeholder="비밀번호를 한 번 더 입력해 주세요." autocomplete="new-password" required>
        </div>
        <button type="submit">가입하기</button>
        <p class="login-link">이미 계정이 있으신가요? <a href="login.html" th:href="@{/login}">로그인</a></p>
      </form>
    </section>
  </main>
  <script>
    const password = document.getElementById('password');
    const confirmation = document.getElementById('password-confirm');
    function validateConfirmation() {
      confirmation.setCustomValidity(confirmation.value && confirmation.value !== password.value
        ? '비밀번호가 일치하지 않습니다.' : '');
    }
    password.addEventListener('input', validateConfirmation);
    confirmation.addEventListener('input', validateConfirmation);
  </script>
</body>
</html>
