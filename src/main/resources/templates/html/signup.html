<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>회원가입 | 늘푸른요양병원</title>

  <link rel="stylesheet"
        href="../../static/css/signup.css"
        th:href="@{/css/signup.css}">
</head>

<body class="signup-body">

  <main class="signup-page">
    <section class="signup-card" aria-labelledby="signup-title">

      <header class="signup-header">
        <h1 id="signup-title">회원가입</h1>
        <p>직원 정보를 입력해 계정을 생성해 주세요.</p>
      </header>

      <form class="signup-form"
            action="/signup"
            th:action="@{/signup}"
            th:object="${signup}"
            method="post">

        <!-- Service에서 발생한 회원가입 오류 -->
        <p class="signup-error"
           role="alert"
           th:if="${errorMessage}"
           th:text="${errorMessage}">
        </p>

        <!-- DTO Validation 오류 -->
        <ul class="signup-error"
            role="alert"
            th:if="${#fields.hasErrors('*')}">

          <li th:each="error : ${#fields.errors('*')}"
              th:text="${error}">
          </li>
        </ul>

        <!-- 이름 -->
        <div class="signup-field name-field">
          <label for="userName">이름</label>

          <input id="userName"
                 name="userName"
                 th:field="*{userName}"
                 type="text"
                 maxlength="20"
                 autocomplete="name"
                 placeholder="이름을 입력해 주세요."
                 required>
        </div>

        <!-- 사용자 아이디 -->
        <div class="signup-field username-field">
          <label for="userId">아이디</label>

          <div class="username-check-row">
            <input id="userId"
                   name="userId"
                   th:field="*{userId}"
                   type="text"
                   maxlength="20"
                   autocomplete="username"
                   autocapitalize="none"
                   spellcheck="false"
                   placeholder="아이디를 입력하세요."
                   required>

            <button type="button"
                    id="checkUserIdBtn"
                    class="username-check-btn">
              중복확인
            </button>
          </div>

          <p id="userIdMessage"
             class="username-message"
             role="status">
          </p>

          <input type="hidden"
                 id="userIdChecked"
                 name="userIdChecked"
                 value="false">
        </div>

        <!-- 담당 병동 -->
        <div class="signup-field ward-field">
          <label for="wardId">담당 병동</label>

          <select id="wardId"
                  name="wardId"
                  th:field="*{wardId}">

            <option value="">특정 병동 없음</option>

            <option th:each="ward : ${wards}"
                    th:value="${ward.wardId}"
                    th:text="${ward.wardName}">
            </option>
          </select>
        </div>

        <!-- 비밀번호 -->
        <div class="signup-field password-field">
          <label for="password">비밀번호</label>

          <div class="password-input-wrap">
            <input id="password"
                   name="password"
                   type="password"
                   autocomplete="new-password"
                   minlength="8"
                   pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                   title="영문과 숫자를 포함해 8자 이상 입력해 주세요."
                   placeholder="영문, 숫자 포함 8자 이상"
                   aria-describedby="password-rules"
                   required>

            <button class="password-toggle"
                    type="button"
                    aria-label="비밀번호 표시"
                    aria-controls="password"
                    aria-pressed="false">

              <svg viewBox="0 0 24 24"
                   aria-hidden="true"
                   focusable="false">

                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
                <path class="eye-slash" d="M3 3 21 21"/>
              </svg>
            </button>
          </div>

          <div id="password-rules"
               class="password-feedback">

            <span id="rule-letter"
                  class="validation-item">
              영문 포함
            </span>

            <span id="rule-number"
                  class="validation-item">
              숫자 포함
            </span>

            <span id="rule-length"
                  class="validation-item">
              8자 이상
            </span>
          </div>
        </div>

        <!-- 비밀번호 확인 -->
        <div class="signup-field confirm-field">
          <label for="passwordConfirm">비밀번호 확인</label>

          <div class="password-input-wrap">
            <input id="passwordConfirm"
                   name="passwordConfirm"
                   type="password"
                   autocomplete="new-password"
                   minlength="8"
                   placeholder="비밀번호를 한 번 더 입력해 주세요."
                   aria-describedby="password-match"
                   required>

            <button class="password-toggle"
                    type="button"
                    aria-label="비밀번호 확인 표시"
                    aria-controls="passwordConfirm"
                    aria-pressed="false">

              <svg viewBox="0 0 24 24"
                   aria-hidden="true"
                   focusable="false">

                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
                <path class="eye-slash" d="M3 3 21 21"/>
              </svg>
            </button>
          </div>

          <div class="password-feedback"
               aria-live="polite">

            <span id="password-match"
                  class="validation-item">
              새 비밀번호와 일치하는지 확인해 주세요.
            </span>
          </div>
        </div>

        <button class="signup-submit full-width"
                type="submit">
          가입하기
        </button>

        <p class="signup-login full-width">
          이미 계정이 있으신가요?

          <a href="login.html"
             th:href="@{/login}">
            로그인
          </a>
        </p>

      </form>
    </section>
  </main>

  <!-- 사용자 아이디 중복확인 -->
  <script src="../../static/JS/signup/ID_check.js"
          th:src="@{/JS/signup/ID_check.js}">
  </script>

  <!-- 비밀번호 확인 -->
  <script src="../../static/JS/signup/Password_check.js"
          th:src="@{/JS/signup/Password_check.js}">
  </script>

</body>
</html>
