<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 | 늘푸른요양병원</title>

  <link rel="stylesheet"
        href="../../static/css/signup.css"
        th:href="@{/css/signup.css}">
</head>

<body class="signup-body">
  <main class="signup-page">
    <section class="signup-card" aria-labelledby="signup-title">

      <header class="signup-header">
        <h1 id="signup-title">회원가입</h1>
        <p>직원 정보를 입력해 계정을 생성해 주세요.</p>
      </header>

      <form class="signup-form"
            action="/signup"
            th:action="@{/signup}"
            method="post">

        <div class="signup-field name-field">
          <label for="name">이름</label>
          <input id="name"
                 name="name"
                 type="text"
                 autocomplete="name"
                 placeholder="이름을 입력해 주세요."
                 required>
        </div>

        <div class="signup-field username-field">
          <label for="username">아이디</label>
          <div class="username-check-row">
            <input id="username"
                 name="username"
                 type="text"
                 autocomplete="username"
                 autocapitalize="none"
                 spellcheck="false"
                 placeholder="아이디를 입력하세요."
                 required>
            <button type="button" id="checkUsernameBtn" class="username-check-btn">중복확인</button>
          </div>
            <p id="usernameMessage" class="username-message" role="status"></p>
            <!-- 중복확인 통과 여부를 서버로 같이 넘기기 위한 hidden 필드 -->
            <input type="hidden" id="usernameChecked" name="usernameChecked" value="false">
        </div>

                <div class="signup-field ward-field">
          <label for="wardId">담당 병동</label>

          <select id="wardId" name="wardId" required>
            <option value="" disabled selected>병동을 선택해 주세요.</option>
            <option value="A">A병동</option>
            <option value="B">B병동</option>
            <option value="C">C병동</option>
            <option value="D">D병동</option>
            <option value="E">E병동</option>
            <option value="F">F병동</option>
          </select>
        </div>


        <div class="signup-field password-field">
          <label for="password">비밀번호</label>

          <div class="password-input-wrap">
            <input id="password"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                  title="영문과 숫자를 포함해 8자 이상 입력해 주세요."
                  placeholder="영문, 숫자 포함 8자 이상"
                  aria-describedby="password-rules"
                  required>

            <button class="password-toggle"
                    type="button"
                    aria-label="비밀번호 표시"
                    aria-controls="password"
                    aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
                <path class="eye-slash" d="M3 3 21 21"/>
              </svg>
            </button>
          </div>

          <div id="password-rules" class="password-feedback">
            <span id="rule-letter" class="validation-item">영문 포함</span>
            <span id="rule-number" class="validation-item">숫자 포함</span>
            <span id="rule-length" class="validation-item">8자 이상</span>
          </div>
        </div>

        <div class="signup-field confirm-field">
          <label for="passwordConfirm">비밀번호 확인</label>

          <div class="password-input-wrap">
            <input id="passwordConfirm"
                  name="passwordConfirm"
                  type="password"
                  autocomplete="new-password"
                  minlength="8"
                  placeholder="비밀번호를 한 번 더 입력해 주세요."
                  aria-describedby="password-match"
                  required>

            <button class="password-toggle"
                    type="button"
                    aria-label="비밀번호 확인 표시"
                    aria-controls="passwordConfirm"
                    aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
                <path class="eye-slash" d="M3 3 21 21"/>
              </svg>
            </button>
          </div>

          <div class="password-feedback" aria-live="polite">
            <span id="password-match" class="validation-item">
              새 비밀번호와 일치하는지 확인해 주세요.
            </span>
          </div>
        </div>

        <button class="signup-submit full-width" type="submit">
          가입하기
        </button>

        <p class="signup-login full-width">
          이미 계정이 있으신가요?
          <a href="login.html" th:href="@{/login}">로그인</a>
        </p>
      </form>

    </section>
  </main>

  <script th:inline="none">
  (function () {
    const usernameInput = document.getElementById('username');
    const checkBtn = document.getElementById('checkUsernameBtn');
    const messageEl = document.getElementById('usernameMessage');
    const checkedFlag = document.getElementById('usernameChecked');
    const form = document.querySelector('.signup-form');

    // 아이디를 수정하면 다시 확인하도록 초기화
    usernameInput.addEventListener('input', () => {
      checkedFlag.value = 'false';
      messageEl.textContent = '';
      messageEl.className = 'username-message';
    });

    checkBtn.addEventListener('click', async () => {
      const username = usernameInput.value.trim();

      if (!username) {
        messageEl.textContent = '아이디를 입력해 주세요.';
        messageEl.className = 'username-message is-taken';
        return;
      }

      checkBtn.disabled = true;
      messageEl.textContent = '확인 중...';
      messageEl.className = 'username-message';

      try {
        const res = await fetch(
          `/api/users/check-username?username=${encodeURIComponent(username)}`
        );

        if (!res.ok) throw new Error('서버 오류');

        const data = await res.json(); // { available: true/false }

        if (data.available) {
          messageEl.textContent = '사용 가능한 아이디입니다.';
          messageEl.className = 'username-message is-available';
          checkedFlag.value = 'true';
        } else {
          messageEl.textContent = '이미 사용 중인 아이디입니다.';
          messageEl.className = 'username-message is-taken';
          checkedFlag.value = 'false';
        }
      } catch (err) {
        messageEl.textContent = '중복확인 중 오류가 발생했습니다. 다시 시도해 주세요.';
        messageEl.className = 'username-message is-taken';
        checkedFlag.value = 'false';
      } finally {
        checkBtn.disabled = false;
      }
    });

    // 제출 시 중복확인 안 했으면 막기
    form.addEventListener('submit', (e) => {
      if (checkedFlag.value !== 'true') {
        e.preventDefault();
        messageEl.textContent = '아이디 중복확인을 먼저 진행해 주세요.';
        messageEl.className = 'username-message is-taken';
        usernameInput.focus();
      }
    });
  })();
</script>

<script>
  const password = document.getElementById("password");
  const confirmation = document.getElementById("passwordConfirm");

  const letterRule = document.getElementById("rule-letter");
  const numberRule = document.getElementById("rule-number");
  const lengthRule = document.getElementById("rule-length");
  const matchMessage = document.getElementById("password-match");

  function updateRule(element, label, passed) {
    element.classList.toggle("is-valid", passed);
    element.textContent = label;
  }

  function validatePasswords() {
    const value = password.value;
    const hasConfirmation = confirmation.value !== "";
    const matches = value === confirmation.value;

    updateRule(letterRule, "영문 포함", /[A-Za-z]/.test(value));
    updateRule(numberRule, "숫자 포함", /[0-9]/.test(value));
    updateRule(lengthRule, "8자 이상", value.length >= 8);

    confirmation.setCustomValidity(
      hasConfirmation && !matches ? "비밀번호가 일치하지 않습니다." : ""
    );

    matchMessage.classList.toggle("is-valid", hasConfirmation && matches);
    matchMessage.classList.toggle("is-invalid", hasConfirmation && !matches);
    confirmation.setAttribute("aria-invalid", String(hasConfirmation && !matches));

    if (!hasConfirmation) {
      matchMessage.textContent = "새 비밀번호와 일치하는지 확인해 주세요.";
    } else if (matches) {
      matchMessage.textContent = "비밀번호가 일치합니다.";
    } else {
      matchMessage.textContent = "비밀번호가 일치하지 않습니다.";
    }
  }

  password.addEventListener("input", validatePasswords);
  confirmation.addEventListener("input", validatePasswords);
  password.addEventListener("change", validatePasswords);
  confirmation.addEventListener("change", validatePasswords);

  // 비밀번호 표시·숨김
  document.querySelectorAll(".password-toggle").forEach((button) => {
    const input = document.getElementById(button.getAttribute("aria-controls"));
    button.addEventListener("click", () => {
      const showPassword = input.type === "password";
      input.type = showPassword ? "text" : "password";
      button.setAttribute("aria-pressed", String(showPassword));
    });
  });

  validatePasswords();
</script>

</body>
</html>
