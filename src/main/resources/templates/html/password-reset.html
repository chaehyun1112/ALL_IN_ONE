<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 재설정 | 늘푸른요양병원</title>

  <link rel="stylesheet"
        href="../../static/css/password-reset.css"
        th:href="@{/css/password-reset.css}">
</head>

<body class="reset-body">
  <main class="reset-page">
    <section class="reset-content" aria-labelledby="hospital-name">

      <header class="reset-header">
        <p class="reset-eyebrow">AI 영상 기반</p>
        <h1 id="hospital-name">늘푸른요양병원</h1>
        <p class="reset-guide">아이디를 확인 후 비밀번호를 재설정하세요.</p>
      </header>

      <section class="reset-card" aria-labelledby="reset-title">
        <h2 id="reset-title">비밀번호 재설정</h2>
        <p class="reset-description">아이디 확인 후 새 비밀번호를 입력하세요.</p>

        <form class="reset-form"
              action="/password/reset"
              th:action="@{/password/reset}"
              method="post">


           <label for="user-id" class="id-label">아이디 확인</label>

                <div class="id-check-row">
                  <input
                    id="user-id"
                    name="username"
                    class="id-input"
                    type="text"
                    autocomplete="username"
                    placeholder="아이디를 입력해 주세요."
                    aria-describedby="id-check-message"
                  />

                  <button
                    id="id-check-button"
                    type="button"
                    class="id-check-button"
                  >
                    아이디 확인하기
                  </button>
                </div>

                <p
                  id="id-check-message"
                  class="id-check-message"
                  role="status"
                  aria-live="polite"
                ></p>


          <!-- 새 비밀번호 -->
          <div class="reset-field">
            <label for="newPassword">새 비밀번호</label>

            <div class="password-input-wrap">
              <input id="newPassword"
                     name="newPassword"
                     type="password"
                     autocomplete="new-password"
                     minlength="8"
                     pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                     title="영문과 숫자를 포함해 8자 이상 입력해 주세요."
                     placeholder="영문, 숫자 포함 8자 이상"
                     aria-describedby="password-rules"
                     required>

              <button class="password-toggle"
                      type="button"
                      aria-label="새 비밀번호 표시"
                      aria-controls="newPassword"
                      aria-pressed="false">
                <svg viewBox="0 0 24 24"
                     aria-hidden="true"
                     focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>

            <div id="password-rules" class="password-feedback">
              <span id="rule-letter" class="validation-item">
                영문 포함
              </span>
              <span id="rule-number" class="validation-item">
                숫자 포함
              </span>
              <span id="rule-length" class="validation-item">
                8자 이상
              </span>
            </div>
          </div>

          <!-- 비밀번호 확인 -->
          <div class="reset-field">
            <label for="passwordConfirm">비밀번호 확인</label>

            <div class="password-input-wrap">
              <input id="passwordConfirm"
                     name="passwordConfirm"
                     type="password"
                     autocomplete="new-password"
                     minlength="8"
                     placeholder="비밀번호를 한 번 더 입력해 주세요."
                     aria-describedby="password-match"
                     required>

              <button class="password-toggle"
                      type="button"
                      aria-label="비밀번호 확인 표시"
                      aria-controls="passwordConfirm"
                      aria-pressed="false">
                <svg viewBox="0 0 24 24"
                     aria-hidden="true"
                     focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>

            <div class="password-feedback" aria-live="polite">
              <span id="password-match" class="validation-item">
                새 비밀번호와 일치하는지 확인해 주세요.
              </span>
            </div>
          </div>

          <button class="reset-submit" type="submit">
            비밀번호 변경하기
          </button>

          <p class="reset-login">
            <a href="login.html" th:href="@{/login}">
              로그인으로 돌아가기
            </a>
          </p>
        </form>
      </section>

    </section>
  </main>

  <!-- 아이디 -->
  <script>
    const idInput = document.getElementById("user-id");
    const idButton = document.getElementById("id-check-button");
    const idMessage = document.getElementById("id-check-message");

    let activeRequest = null;

    function showIdMessage(text, state = "") {
      idMessage.textContent = text;
      idMessage.classList.toggle("is-success", state === "success");
      idMessage.classList.toggle("is-error", state === "error");
    }

    function setIdLoading(loading) {
      idButton.disabled = loading;
      idButton.textContent = loading
        ? "확인 중..."
        : "아이디 확인하기";
    }

    // 아이디를 수정하면 이전 확인 결과를 지웁니다.
    idInput.addEventListener("input", () => {
      activeRequest?.abort();
      activeRequest = null;

      setIdLoading(false);
      showIdMessage("");
      idInput.removeAttribute("aria-invalid");
    });

    idButton.addEventListener("click", async () => {
      const userId = idInput.value.trim();

      if (!userId) {
        showIdMessage("아이디를 입력해 주세요.", "error");
        idInput.setAttribute("aria-invalid", "true");
        idInput.focus();
        return;
      }

      activeRequest?.abort();
      const request = new AbortController();
      activeRequest = request;

      idInput.removeAttribute("aria-invalid");
      setIdLoading(true);
      showIdMessage("아이디를 확인하고 있습니다.");

      try {
        // API 주소와 요청 필드는 백엔드 규격에 맞게 변경하세요.
        const response = await fetch("/api/auth/check-id", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ userId }),
          signal: request.signal
        });

        if (!response.ok) {
          throw new Error("아이디 확인 요청 실패");
        }

        const data = await response.json();

        // 아이디 수정 후 도착한 이전 응답은 무시합니다.
        if (activeRequest !== request) return;

        if (typeof data.exists !== "boolean") {
          throw new Error("응답 형식 오류");
        }

        if (data.exists) {
          showIdMessage("✓ 아이디가 확인되었습니다.", "success");
          idInput.setAttribute("aria-invalid", "false");
        } else {
          showIdMessage("아이디를 다시 확인해 주세요.", "error");
          idInput.setAttribute("aria-invalid", "true");
        }
      } catch (error) {
        if (error.name === "AbortError") return;
        if (activeRequest !== request) return;

        showIdMessage(
          "확인 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.",
          "error"
        );
      } finally {
        if (activeRequest === request) {
          activeRequest = null;
          setIdLoading(false);
        }
      }
    });
  </script>

<!-- 비밀번호 -->
  <script>
    const password = document.getElementById("newPassword");
    const confirmation = document.getElementById("passwordConfirm");

    const letterRule = document.getElementById("rule-letter");
    const numberRule = document.getElementById("rule-number");
    const lengthRule = document.getElementById("rule-length");
    const matchMessage = document.getElementById("password-match");

    function updateRule(element, label, passed) {
      element.classList.toggle("is-valid", passed);
      element.textContent = label;
    }

    function validatePasswords() {
      const value = password.value;
      const hasConfirmation = confirmation.value !== "";
      const matches = value === confirmation.value;

      updateRule(letterRule, "영문 포함", /[A-Za-z]/.test(value));
      updateRule(numberRule, "숫자 포함", /[0-9]/.test(value));
      updateRule(lengthRule, "8자 이상", value.length >= 8);

      confirmation.setCustomValidity(
        hasConfirmation && !matches
          ? "비밀번호가 일치하지 않습니다."
          : ""
      );

      matchMessage.classList.toggle(
        "is-valid",
        hasConfirmation && matches
      );

      matchMessage.classList.toggle(
        "is-invalid",
        hasConfirmation && !matches
      );

      confirmation.setAttribute(
        "aria-invalid",
        String(hasConfirmation && !matches)
      );

      if (!hasConfirmation) {
        matchMessage.textContent =
          "새 비밀번호와 일치하는지 확인해 주세요.";
      } else if (matches) {
        matchMessage.textContent = "비밀번호가 일치합니다.";
      } else {
        matchMessage.textContent = "비밀번호가 일치하지 않습니다.";
      }
    }

    password.addEventListener("input", validatePasswords);
    confirmation.addEventListener("input", validatePasswords);
    password.addEventListener("change", validatePasswords);
    confirmation.addEventListener("change", validatePasswords);

    // 각 입력란의 비밀번호 표시·숨김
    document.querySelectorAll(".password-toggle").forEach((button) => {
      const input = document.getElementById(
        button.getAttribute("aria-controls")
      );

      button.addEventListener("click", () => {
        const showPassword = input.type === "password";

        input.type = showPassword ? "text" : "password";
        button.setAttribute("aria-pressed", String(showPassword));
      });
    });

    validatePasswords();
  </script>
</body>
</html>
