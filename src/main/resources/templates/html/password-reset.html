<!-- PGH -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 재설정 | 환자낙상예방</title>
  <!-- Spring 실행 시 th:href가 적용되고, 직접 HTML 확인 시 일반 href가 사용된다. -->
  <link rel="stylesheet" th:href="@{/css/auth/password-reset.css}" href="../../static/css/auth/password-reset.css">
</head>
<body class="reset-body">
  <main class="reset-page">
    <section class="reset-content" aria-labelledby="hospital-name">
      <header class="reset-header">
        <p class="reset-eyebrow">AI 영상 기반</p>
        <h1 id="hospital-name">환자낙상예방</h1>
        <p class="reset-guide">비밀번호를 잊으셨나요?</p>
      </header>

      <section class="reset-card" aria-labelledby="reset-title">
        <h2 id="reset-title">비밀번호 재설정 안내</h2>
        <p class="reset-description">안전한 본인 확인 후 비밀번호를 재설정할 수 있습니다.</p>
        <!-- role="status"는 화면 낭독기가 안내 메시지로 인식하도록 돕는 접근성 속성이다. -->
        <div class="reset-notice" role="status">
          안전한 본인 확인을 위해 소속 병동 관리자에게 비밀번호 초기화를 요청해 주세요.
        </div>
        <p class="reset-detail">
          현재 요구사항에는 이메일·휴대전화 등 본인 확인 수단이 정의되어 있지 않아
          직원 ID와 직원명만으로 비밀번호를 변경하지 않습니다.
        </p>
        <!-- TODO: 관리자 초기화 또는 별도 본인 인증 방식이 확정되면 재설정 요청 폼을 구현한다. -->
        <!-- @{/login} 문법은 애플리케이션 Context Path를 포함한 안전한 URL을 생성한다. -->
        <p class="reset-login"><a th:href="@{/login}" href="/login">로그인으로 돌아가기</a></p>
      </section>
    </section>
  </main>
</body>
</html>
