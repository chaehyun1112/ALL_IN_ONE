<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 재설정 | 늘푸른요양병원</title>

  <link rel="stylesheet"
        href="../../static/css/auth/password-reset.css"
        th:href="@{/css/auth/password-reset.css}">
</head>

<body class="reset-body">
  <main class="reset-page">
    <section class="reset-content" aria-labelledby="hospital-name">

      <header class="reset-header">
        <p class="reset-eyebrow">AI 영상 기반</p>
        <h1 id="hospital-name">늘푸른요양병원</h1>
        <p class="reset-guide">아이디를 확인 후 비밀번호를 재설정하세요.</p>
      </header>

      <section class="reset-card" aria-labelledby="reset-title">
        <h2 id="reset-title">비밀번호 재설정</h2>
        <p class="reset-description">아이디 확인 후 새 비밀번호를 입력하세요.</p>

        <form class="reset-form"
              action="/password/reset"
              th:action="@{/password/reset}"
              method="post">


           <label for="user-id" class="id-label">아이디 확인</label>

                <div class="id-check-row">
                  <input
                    id="user-id"
                    name="username"
                    class="id-input"
                    type="text"
                    autocomplete="username"
                    placeholder="아이디를 입력해 주세요."
                    aria-describedby="id-check-message"
                  />

                  <button
                    id="id-check-button"
                    type="button"
                    class="id-check-button"
                  >
                    아이디 확인하기
                  </button>
                </div>

                <p
                  id="id-check-message"
                  class="id-check-message"
                  role="status"
                  aria-live="polite"
                ></p>


          <!-- 새 비밀번호 -->
          <div class="reset-field">
            <label for="newPassword">새 비밀번호</label>

            <div class="password-input-wrap">
              <input id="newPassword"
                     name="newPassword"
                     type="password"
                     autocomplete="new-password"
                     minlength="8"
                     pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                     title="영문과 숫자를 포함해 8자 이상 입력해 주세요."
                     placeholder="영문, 숫자 포함 8자 이상"
                     aria-describedby="password-rules"
                     required>

              <button class="password-toggle"
                      type="button"
                      aria-label="새 비밀번호 표시"
                      aria-controls="newPassword"
                      aria-pressed="false">
                <svg viewBox="0 0 24 24"
                     aria-hidden="true"
                     focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>

            <div id="password-rules" class="password-feedback">
              <span id="rule-letter" class="validation-item">
                영문 포함
              </span>
              <span id="rule-number" class="validation-item">
                숫자 포함
              </span>
              <span id="rule-length" class="validation-item">
                8자 이상
              </span>
            </div>
          </div>

          <!-- 비밀번호 확인 -->
          <div class="reset-field">
            <label for="passwordConfirm">비밀번호 확인</label>

            <div class="password-input-wrap">
              <input id="passwordConfirm"
                     name="passwordConfirm"
                     type="password"
                     autocomplete="new-password"
                     minlength="8"
                     placeholder="비밀번호를 한 번 더 입력해 주세요."
                     aria-describedby="password-match"
                     required>

              <button class="password-toggle"
                      type="button"
                      aria-label="비밀번호 확인 표시"
                      aria-controls="passwordConfirm"
                      aria-pressed="false">
                <svg viewBox="0 0 24 24"
                     aria-hidden="true"
                     focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>

            <div class="password-feedback" aria-live="polite">
              <span id="password-match" class="validation-item">
                새 비밀번호와 일치하는지 확인해 주세요.
              </span>
            </div>
          </div>

          <button class="reset-submit" type="submit">
            비밀번호 변경하기
          </button>

          <p class="reset-login">
            <a href="login.html" th:href="@{/login}">
              로그인으로 돌아가기
            </a>
          </p>
        </form>
      </section>

    </section>
  </main>

  <!-- 아이디 확인 -->
  <script src="../../static/JS/password-rest/ID_check.js"
          th:src="@{/JS/password-rest/ID_check.js}"></script>

<!-- 비밀번호 확인 -->
  <script src="../../static/JS/password-rest/Password_check.js"
          th:src="@{/JS/password-rest/Password_check.js}"></script>
</body>
</html>
