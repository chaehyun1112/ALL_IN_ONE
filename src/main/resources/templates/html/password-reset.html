<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 재설정 | 늘푸른요양병원</title>

  <link rel="stylesheet"
        href="../../static/css/password-reset.css"
        th:href="@{/css/password-reset.css}">
</head>

<body class="reset-body">
  <main class="reset-page">
    <section class="reset-content" aria-labelledby="hospital-name">

      <header class="reset-header">
        <p class="reset-eyebrow">AI 영상 기반</p>
        <h1 id="hospital-name">늘푸른요양병원</h1>
        <p class="reset-guide">
          비밀번호를 재설정하세요.
        </p>
      </header>

      <section class="reset-card" aria-labelledby="reset-title">
        <h2 id="reset-title">비밀번호 재설정</h2>
        <p class="reset-description">
          새 비밀번호를 입력하세요.
        </p>

        <form class="reset-form"
              action="/password/reset"
              th:action="@{/password/reset}"
              method="post">

          <div class="reset-field">
            <label for="newPassword">새 비밀번호</label>
            <input id="newPassword"
                   name="newPassword"
                   type="password"
                   autocomplete="new-password"
                   minlength="8"
                   pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                   title="영문과 숫자를 포함해 8자 이상 입력해 주세요."
                   placeholder="영문, 숫자 포함 8자 이상"
                   required>
          </div>

          <div class="reset-field">
            <label for="passwordConfirm">비밀번호 확인</label>
            <input id="passwordConfirm"
                   name="passwordConfirm"
                   type="password"
                   autocomplete="new-password"
                   minlength="8"
                   placeholder="비밀번호를 한 번 더 입력해 주세요."
                   required>
          </div>

          <button class="reset-submit" type="submit">
            비밀번호 변경하기
          </button>

          <p class="reset-login">
            <a href="login.html" th:href="@{/login}">
              로그인으로 돌아가기
            </a>
          </p>
        </form>
      </section>

    </section>
  </main>

  <script>
    const password = document.getElementById("newPassword");
    const confirmation = document.getElementById("passwordConfirm");

    function validatePasswords() {
      const mismatch =
        confirmation.value !== "" &&
        password.value !== confirmation.value;

      confirmation.setCustomValidity(
        mismatch ? "비밀번호가 일치하지 않습니다." : ""
      );
    }

    password.addEventListener("input", validatePasswords);
    confirmation.addEventListener("input", validatePasswords);
  </script>
</body>
</html>
