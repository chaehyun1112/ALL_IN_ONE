<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CareGuard · 병동 통합 관제</title>

  <!-- [2026.09.16] 고친 내용: 선택 카드 테두리 변경이 이전 브라우저 캐시에 남지 않도록 새 CSS 버전을 불러옵니다. -->
  <link
    rel="stylesheet"
    href="../../../static/css/dashboard/dashboard.css?v=20260916-2" th:href="@{/css/dashboard/dashboard.css(v='20260916-2')}"
  >
  <!-- [09.13]추가내용: 병실 상태와 선택 표시를 기능별 CSS 파일로 연결합니다. -->
  <link rel="stylesheet" href="../../../static/css/dashboard/room-status.css" th:href="@{/css/dashboard/room-status.css}">
  <link rel="stylesheet" href="../../../static/css/dashboard/room-selection.css" th:href="@{/css/dashboard/room-selection.css}">
</head>

<body th:attr="data-session-url=@{/api/dashboard/session}">
  <!-- 상단 헤더 -->
  <header>
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">+</div>
      <strong>CareGuard</strong>
      <span>병동 통합 관제</span>
    </div>

    <div class="header-actions">
      <!-- 현재 시간 -->
      <time id="clock"></time>
      <!-- [2026.09.16] 추가한 내용: 현재 시간 옆에 전체화면 진입·해제 버튼을 추가합니다. -->
      <button type="button" class="fullscreen-toggle" id="fullscreen-toggle"
              aria-label="전체화면" aria-pressed="false" title="전체화면">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path class="fullscreen-enter" d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5"/>
          <path class="fullscreen-exit" d="M3 8h5V3M21 8h-5V3M16 21v-5h5M8 21v-5H3"/>
        </svg>
        <span id="fullscreen-label">전체화면</span>
      </button>

      <!-- [수정완료] 더보기 버튼을 사용자 프로필 드롭다운으로 변경합니다. -->
      <div class="header-menu">
        <button
          type="button"
          class="profile-toggle"
          id="profile-toggle"
          aria-label="사용자 메뉴"
          aria-expanded="false"
          aria-controls="header-menu-list"
        >
          <!-- [09.13]수정내용: 단순 점을 머리와 어깨가 보이는 사람 모양 SVG 아이콘으로 변경합니다. -->
          <span class="profile-avatar" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <circle cx="12" cy="8" r="3.5"/>
              <path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
            </svg>
          </span>
          <!-- [수정완료] 로그인한 계정 아이디에 따라 프로필 이름을 표시합니다. -->
          <!-- [수정완료] 로그인에서 입력한 이름을 프로필에 표시합니다. -->
          <span class="profile-copy"><strong th:text="${displayName + ' 간호사'}">이름 간호사</strong><small>A병동</small></span>
          <span class="profile-chevron" aria-hidden="true">▿</span>
        </button>

        <nav
          class="header-menu-list"
          id="header-menu-list"
          aria-label="대시보드 메뉴"
          hidden
        >
          <a href="../record/record.html"
             th:href="@{/Record}">조치기록</a>
          <!-- [수정완료] 프로필 메뉴에서 설정 화면으로 이동합니다. -->
          <a href="../settings/settings.html" th:href="@{/settings}" id="settings-open">설정</a>
          <!-- [수정완료] 프로필 메뉴의 마지막에 로그아웃을 배치합니다. -->
          <button
            type="submit"
            id="logout-open"
            form="logout-form"
          >
            로그아웃
          </button>
        </nav>
      </div>
    </div>
  </header>

  <form id="logout-form" action="../auth/index.html" th:action="@{/logout}"
        method="get" th:method="post" hidden></form>

  <main>
    <!-- 오늘의 안전 현황 -->
    <div class="page-heading">
      <section class="panel summary">
        <h2>오늘의 안전 현황</h2>

        <div class="counts">
          <!-- [2026.09.16] 고친 내용: 안전 현황 카드의 순서와 문구를 전체·낙상·침대 이탈·정상으로 변경합니다. -->
          <div class="count all"><span>전체</span><b id="all-count">17</b></div>
          <div class="count urgent">
            <span>낙상</span>
            <b id="urgent-count">1</b>
          </div>
          <div class="count caution">
            <span>침대 이탈</span>
            <b id="caution-count">1</b>
          </div>
          <div class="count">
            <span>정상</span>
            <b id="normal-count">15</b>
          </div>
        </div>
      </section>
    </div>

    <div class="layout">
      <!-- 병동 평면도 -->
      <section class="panel floor-panel">
        <div class="panel-heading">
          <h2>병실별 안전 상태</h2>

          <!-- [09.13]수정내용: 범례와 등록 버튼을 오른쪽 세로 영역으로 묶습니다. -->
          <div class="room-heading-actions">
          <div class="legend">
            <span>정상</span>
            <span class="caution">주의</span>
            <span class="urgent">긴급</span>
          </div>
          <!-- [09.13]수정내용: 대응 등록 버튼을 병실 범례의 정상·주의·긴급 표시 바로 아래에 배치합니다. -->
          <div class="legend-response">
            <button type="button" id="response-open" class="response-open" style="visibility: hidden" disabled>대응 등록</button>
          </div>
          </div>
        </div>

        <!-- [09.13]수정내용: 버튼 이동 후 남은 빈 도구 모음을 제거해 관제 화면 위 여백을 줄입니다. -->

        <div class="floor">
          <!-- 위쪽 병실은 JS로 생성됩니다 -->
          <div
            class="room-row"
            id="upper-rooms"
          ></div>

          <!-- 중앙 복도 -->
          <!-- [2026.09.16] 추가한 내용: 복도 낙상 감지 위치도 병실처럼 선택하고 확인할 수 있게 합니다. -->
          <!-- [2026.09.16] 고친 내용: 복도 감지 위치를 카메라 ID 대신 사람이 찾기 쉬운 위치명으로 안내합니다. -->
          <button type="button" class="corridor" id="central-corridor" aria-label="중앙 복도 · 305호 앞 · 낙상 감지">
            <span>←</span>
            <span>중앙 복도</span>
            <i class="corridor-alert-marker" aria-hidden="true"></i>
            <span>→</span>
          </button>

          <!-- 아래쪽 병실은 JS로 생성됩니다 -->
          <div
            class="room-row bottom"
            id="lower-rooms"
          ></div>
        </div>

        <!-- [2026.09.16] 고친 내용: 선택 병실의 오늘 기록은 아래 독립 카드 섹션으로 이동합니다. -->
      </section>

      <!-- 확인이 필요한 알림 -->
      <aside class="side">
        <section class="panel alerts-panel">
          <div class="alert-heading">
            <h2>확인이 필요한 알림</h2>
            <span
              class="alert-total"
              id="alert-total"
            >
              2건
            </span>
          </div>

          <!-- 낙상 감지 알림 -->
          <article
            class="alert-card"
            data-alert-room="305"
          >
            <div class="alert-top">
              <strong>● 긴급</strong>
              <time>14:28</time>
            </div>

            <h3>
              305호
              <span class="event-label">낙상 감지</span>
            </h3>

            <p>즉시 확인해 주세요.</p>

            <button
              type="button"
              class="locate-room"
              data-locate="305"
            >
              위치 확인 →
            </button>
          </article>

          <!-- 침대 이탈 알림 -->
          <article
            class="alert-card caution"
            data-alert-room="312"
          >
            <div class="alert-top">
              <strong>● 주의</strong>
              <time>14:31</time>
            </div>

            <h3>
              312호
              <span class="event-label">침대 이탈</span>
            </h3>

            <p>병실을 확인해주세요.</p>

            <button
              type="button"
              class="locate-room"
              data-locate="312"
            >
              위치 확인 →
            </button>
          </article>
        </section>
      </aside>
    </div>
    <!-- [2026.09.16] 고친 내용: 하단 전체 너비에 병실명·오늘의 건수·최근 기록을 가로로 배치합니다. -->
    <section class="panel dashboard-history-card" aria-label="선택 병실의 오늘 기록">
      <div id="room-detail" class="selection" role="status">병실을 선택해 주세요.</div>
    </section>
  </main>

  <!-- 설정 창 -->
  <dialog
    class="settings-dialog"
    id="settings-dialog"
  >
    <h2>설정</h2>

    <!-- [수정완료] 대시보드에서 선택한 필터 내용을 설정 창에 표시합니다. -->
    <p id="settings-filter">현재 필터: 전체 병실</p>
    <p id="settings-summary">전체 병실을 표시하고 있습니다.</p>

    <form method="dialog">
      <button type="submit">
        닫기
      </button>
    </form>
  </dialog>

  <!-- 대응 등록 창 -->
  <dialog
    id="response-dialog"
    class="response-dialog"
    aria-labelledby="response-title"
  >
    <form id="response-form">
      <h2 id="response-title">
        경보 대응 등록
      </h2>

      <p>
        현장 확인 후 대응 정보를 등록해 주세요.
      </p>

      <!-- 선택한 경보 정보가 JS로 표시됩니다 -->
      <div
        id="response-event"
        class="response-event"
      ></div>

      <!-- 환자 이름 -->
      <label
        class="field"
        for="response-patient"
      >
        환자 이름
      </label>

      <input
        id="response-patient"
        type="text"
        required
        maxlength="50"
        placeholder="환자 이름을 입력하세요."
      >

      <!-- 간호사 이름 -->
      <label
        class="field"
        for="response-nurse"
      >
        간호사 이름
      </label>

      <input
        id="response-nurse"
        type="text"
        required
        maxlength="50"
        placeholder="간호사 이름을 입력하세요."
      >

      <!-- 조치 상태 -->
      <fieldset>
        <legend>조치 상태</legend>

        <div class="response-options">
          <label>
            <input
              type="radio"
              name="response-status"
              value="checking"
              checked
            >
            확인 중
          </label>

          <label>
            <input
              type="radio"
              name="response-status"
              value="complete"
            >
            조치 완료
          </label>
        </div>
      </fieldset>

      <!-- 조치 내용 -->
      <label
        class="field"
        for="response-note"
      >
        조치 내용
      </label>

      <textarea
        id="response-note"
        maxlength="1000"
        required
        placeholder="확인한 상태와 조치 내용을 입력하세요."
      ></textarea>

      <div class="response-actions">
        <button
          type="button"
          id="response-cancel"
        >
          취소
        </button>

        <button type="submit">
          조치 기록 등록
        </button>
      </div>
    </form>
  </dialog>

  <!-- JS는 body가 모두 만들어진 후 실행합니다 -->
  <script src="../../../static/JS/dashboard/session.js" th:src="@{/JS/dashboard/session.js}"></script>
  <script src="../../../static/JS/dashboard/room-status.js" th:src="@{/JS/dashboard/room-status.js}"></script>
  <script src="../../../static/JS/dashboard/room-selection.js" th:src="@{/JS/dashboard/room-selection.js}"></script>
  <script src="../../../static/JS/dashboard/dashboard.js" th:src="@{/JS/dashboard/dashboard.js}"></script>
</body>
</html>
