<!-- PGH -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대시보드 | 환자낙상예방</title>
</head>
<body>
  <main>
    <h1>로그인되었습니다.</h1>
    <!-- Controller가 Model에 넣은 userId(현재 로그인 사용자의 직원 ID)를 화면에 출력한다. -->
    <p><span th:text="${userId}">사용자</span>님, 환영합니다.</p>

    <!-- 관리자가 APPROVED로 변경한 계정에만 실제 기능 영역을 보여준다. -->
    <section th:if="${approved}">
      <p>승인이 완료된 계정입니다.</p>
      <!-- TODO: 관제·조회 화면 URL이 확정되면 승인 사용자용 링크를 이 영역에 추가한다. -->
      <p><a th:href="@{/user/password}" href="/user/password">비밀번호 변경</a></p>
    </section>

    <!-- PENDING 사용자는 로그인은 가능하지만 관제·조회 기능을 표시하지 않는다. -->
    <section th:unless="${approved}">
      <h2>관리자 승인 대기 중입니다.</h2>
      <p>관리자가 권한을 승인한 후 관제 및 조회 기능을 사용할 수 있습니다.</p>
    </section>
    <!-- 로그아웃은 상태를 변경하므로 링크(GET)가 아닌 CSRF 보호를 받는 POST form을 사용한다. -->
    <form th:action="@{/logout}" method="post"><button type="submit">로그아웃</button></form>
  </main>
</body>
</html>
