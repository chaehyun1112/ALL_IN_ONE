<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>늘푸른요양병원 | 접속 유형 선택</title>
    <link rel="stylesheet" th:href="@{/css/auth/access-type.css}" href="../../static/css/auth/access-type.css">
</head>
<body>
    <main class="access-page">
        <section class="access-content" aria-labelledby="access-title">
            <header class="access-heading">
                <p class="access-eyebrow">AI 영상 기반</p>
                <h1 id="access-title">늘푸른요양병원</h1>
                <p class="access-description">업무에 맞는 접속 유형을 선택해 주세요.</p>
            </header>

            <div class="access-panel" aria-labelledby="role-title">
                <div class="panel-heading">
                    <h2 id="role-title">접속 유형 선택</h2>
                    <p>업무에 맞는 유형을 선택하면 로그인 화면으로 이동합니다.</p>
                </div>

                <div class="role-list" role="group" aria-label="접속 유형">
                    <a class="role-card" href="login.html?accessType=admin" th:href="@{/login(accessType='admin')}" data-role="admin">
                        <span class="role-icon" aria-hidden="true">
                            <svg viewBox="0 0 48 48">
                                <path d="M20 4h8l1.4 5.1L34 6.5l5.5 5.5-2.6 4.6L42 18v8l-5.1 1.4 2.6 4.6-5.5 5.5-4.6-2.6L28 40h-8l-1.4-5.1-4.6 2.6L8.5 32l2.6-4.6L6 26v-8l5.1-1.4L8.5 12 14 6.5l4.6 2.6L20 4z"></path>
                                <circle cx="24" cy="22" r="6"></circle>
                            </svg>
                        </span>
                        <span class="role-name">관리자</span>
                        <span class="role-description">병원 운영 설정 및<br>전체 현황 관리</span>
                        <span class="role-action">선택하기 <span aria-hidden="true">→</span></span>
                    </a>

                    <a class="role-card" href="login.html?accessType=user" th:href="@{/login(accessType='user')}" data-role="user">
                        <span class="role-icon" aria-hidden="true">
                            <svg viewBox="0 0 48 48">
                                <path d="M20 5h8v15h15v8H28v15h-8V28H5v-8h15V5z"></path>
                            </svg>
                        </span>
                        <span class="role-name">간호사</span>
                        <span class="role-description">병동 모니터링 및<br>환자 안전 관리</span>
                        <span class="role-action">선택하기 <span aria-hidden="true">→</span></span>
                    </a>
                </div>

                <p class="selection-message" aria-live="polite"></p>
            </div>
        </section>
    </main>

    <script th:src="@{/js/signup/access-type.js}" src="../../static/js/signup/access-type.js" defer></script>
</body>
</html>
