<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title th:text="|로그인 · ${hospitalName}|">
    로그인 | 환자낙상예방
  </title>

  <link rel="stylesheet"
        th:href="@{/css/auth/login.css}"
        href="../../../static/css/auth/login.css">
    <!-- [2026.09.19] 추가: ALLEYES 로고와 서비스 이름의 공통 정렬 스타일입니다. -->
    <link rel="stylesheet" href="../../../static/css/alleyes-brand.css" th:href="@{/css/alleyes-brand.css}">
</head>

<body>

  <main class="login-page">
    <section class="login-content"
             aria-labelledby="hospital-name">

      <header class="service-intro">
        <!-- [2026.09.19] 수정: 상단 서비스 이름을 ALLEYES로 표시합니다. -->
        <p class="service-eyebrow alleyes-brand"><img class="alleyes-logo" src="../../../static/image/brand/alleyes-logo.png" th:src="@{/image/brand/alleyes-logo.png}" alt="" width="44" height="42">ALLEYES</p>

        <h1 id="hospital-name"
            th:text="${hospitalName}">
          병원명
        </h1>

        <p class="service-description">
          등록된 아이디로 로그인해 주세요.
        </p>
      </header>

      <p class="status success"
         th:if="${param.passwordChanged}"
         role="status">
        비밀번호가 변경되었습니다.
        새 비밀번호로 로그인해 주세요.
      </p>

      <form id="userLoginForm"
            class="login-card"
            th:action="@{/login/user}"
            method="post">

        <input id="userLoginKey"
               name="userLoginKey"
               type="hidden"
               th:value="${hospitalId + '|'}">

        <div class="field">
          <label for="userId">아이디</label>

          <input id="userId"
                 name="userId"
                 type="text"
                 placeholder="아이디를 입력해 주세요."
                 autocomplete="username"
                 aria-describedby="passwordError"
                 maxlength="20"
                 autofocus
                 required>
        </div>

        <div class="field password-field">
          <label for="password">비밀번호</label>

          <input id="password"
                 name="password"
                 type="password"
                 placeholder="비밀번호를 입력해 주세요."
                 autocomplete="current-password"
                 aria-describedby="passwordError"
                 required>

          <p id="passwordError"
             class="status error"
             th:if="${param.error != null}"
             role="alert">

            <span th:if="${param.error[0] == 'credentials'}">
              아이디 또는 비밀번호가 일치하지 않습니다.
            </span>

          <span id="loginLockMessage"
                th:if="${param.error[0] == 'locked'}">

              로그인 시도 횟수를 초과했습니다.

              <strong id="loginLockCountdown"
                      aria-live="polite">
                60
              </strong>초 후 다시 시도해 주세요.
            </span>

            <span th:if="${param.error[0] == 'disabled'}">
              로그인할 수 없는 계정입니다.
              관리자에게 문의해 주세요.
            </span>

            <span th:if="${param.error[0] == 'unavailable'}">
              로그인할 수 없습니다.
              잠시 후 다시 시도해 주세요.
            </span>
          </p>
        </div>

        <button class="login-button"
                type="submit">
          로그인
        </button>

        <p class="admin-contact"
           id="adminContact">
          비밀번호를 잊으셨다면 관리자에게 문의해 주세요.
        </p>
      </form>
    </section>
  </main>

  <script src="../../../static/JS/login/login.js"
          th:src="@{/JS/login/login.js}"
          defer></script>

</body>
</html>
