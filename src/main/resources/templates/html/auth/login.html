<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title th:text="|로그인 · ${hospitalName}|">
    로그인 | 환자낙상예방
  </title>

  <link rel="stylesheet"
        th:href="@{/css/auth/login.css}"
        href="../../static/css/auth/login.css">
</head>

<body>

  <!-- 회원가입 완료 메시지를 JavaScript에 전달 -->
  <p id="signupSuccessMessage"
     th:if="${signupSuccessMessage}"
     th:text="${signupSuccessMessage}"
     hidden>
  </p>

  <main class="login-page">
    <section class="login-content"
             aria-labelledby="hospital-name">

      <header class="service-intro">
        <p class="service-eyebrow">
          AI 영상 기반
        </p>

        <h1 id="hospital-name"
            th:text="${hospitalName}">
          병원명
        </h1>

        <p class="service-description">
          등록된 아이디로 로그인해 주세요.
        </p>
      </header>

      <!-- 로그인 실패 메시지 -->
      <p class="status error"
         th:if="${param.error}"
         role="alert">
        직원 ID 또는 비밀번호가 올바르지 않습니다.
      </p>

      <!-- Spring Security 로그인 처리 -->
      <form id="userLoginForm"
            class="login-card"
            th:action="@{/login/user}"
            method="post">

        <!-- 병원 ID와 직원 ID를 합쳐 userLoginKey로 전송 -->
        <input id="userLoginKey"
               name="userLoginKey"
               type="hidden"
               th:value="${hospitalId + '|'}">

        <div class="field">
          <label for="userId">
            아이디
          </label>

          <input id="userId"
                 name="userId"
                 type="text"
                 placeholder="아이디를 입력해 주세요."
                 autocomplete="username"
                 maxlength="20"
                 autofocus
                 required>
        </div>

        <div class="field password-field">
          <label for="password">
            비밀번호
          </label>

          <input id="password"
                 name="password"
                 type="password"
                 placeholder="비밀번호를 입력해 주세요."
                 autocomplete="current-password"
                 required>
        </div>

        <div class="recovery-row">
          <a href="/password/reset"
             th:href="@{/password/reset}">
            비밀번호 재설정
          </a>
        </div>

        <button class="login-button"
                type="submit">
          로그인
        </button>

        <p class="signup-row">
          계정이 없으신가요?

          <a href="/signup"
             th:href="@{/signup}">
            회원가입
          </a>
        </p>

      </form>
    </section>
  </main>

  <!-- 로그인 시 병원 ID와 직원 ID 조합 -->
  <script src="../../static/JS/login/login.js"
          th:src="@{/JS/login/login.js}"
          defer>
  </script>

  <!-- 회원가입 완료 알림 -->
  <script src="../../static/JS/signup/signup-success.js"
          th:src="@{/JS/signup/signup-success.js}"
          defer>
  </script>

</body>
</html>
