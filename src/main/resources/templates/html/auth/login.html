<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title th:text="|로그인 · ${hospitalName}|">로그인 | 환자낙상예방</title>

  <link rel="stylesheet"
        th:href="@{/css/auth/login.css}"
        href="../../../static/css/auth/login.css">
</head>

<body>
  <!-- 회원가입 완료 메시지를 JavaScript에 전달 -->
  <p id="signupSuccessMessage"
     th:if="${signupSuccessMessage}"
     th:text="${signupSuccessMessage}"
     hidden></p>

  <main class="login-page">
    <section class="login-content" aria-labelledby="hospital-name">
      <header class="service-intro">
        <p class="service-eyebrow">AI 영상 기반</p>
        <h1 id="hospital-name" th:text="${hospitalName}">병원명</h1>
        <p class="service-description">등록된 아이디로 로그인해 주세요.</p>
      </header>

      <!-- 비밀번호 변경 완료 메시지 -->
      <p class="status success"
         th:if="${param.passwordChanged}"
         role="status">
        비밀번호가 변경되었습니다. 새 비밀번호로 로그인해 주세요.
      </p>

      <!-- Spring Security 로그인 처리 -->
      <form id="userLoginForm"
            class="login-card"
            th:action="@{/login/user}"
            method="post">

        <!-- login.js에서 병원 ID와 직원 ID를 합쳐서 전송한다. -->
        <input id="userLoginKey"
               name="userLoginKey"
               type="hidden"
               th:value="${hospitalId + '|'}">

        <div class="field">
          <label for="userId">아이디</label>
          <input id="userId"
                 name="userId"
                 type="text"
                 placeholder="아이디를 입력해 주세요."
                 autocomplete="username"
                 aria-describedby="loginError"
                 maxlength="20"
                 autofocus
                 required>
        </div>

        <div class="field password-field">
          <label for="password">비밀번호</label>
          <input id="password"
                 name="password"
                 type="password"
                 placeholder="비밀번호를 입력해 주세요."
                 autocomplete="current-password"
                 aria-describedby="loginError"
                 required>
        </div>

        <p id="loginError"
           class="status error"
           th:if="${param.error}"
           th:switch="${param.error[0]}"
           hidden th:hidden="${param.error == null}"
           role="alert">
          <span th:case="'userId'">등록되지 않은 아이디입니다.</span>
          <span th:case="'password'">비밀번호가 올바르지 않습니다.</span>
          <span th:case="'disabled'">로그인할 수 없는 계정입니다. 관리자에게 문의해 주세요.</span>
          <span th:case="*">로그인할 수 없습니다. 잠시 후 다시 시도해 주세요.</span>
        </p>

        <button class="login-button" type="submit">로그인</button>

        <p class="admin-contact">
          비밀번호를 잊으셨다면 관리자에게 문의해 주세요.
        </p>
      </form>
    </section>
  </main>

  <!-- 병원 ID와 직원 ID 조합 -->
  <script src="../../../static/JS/auth/login.js"
          th:src="@{/JS/auth/login.js}"
          defer></script>

  <!-- 회원가입 완료 알림 -->
  <script src="../../../static/JS/auth/signup-success.js"
          th:src="@{/JS/auth/signup-success.js}"
          defer></script>
</body>
</html>
