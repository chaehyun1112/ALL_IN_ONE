<!-- PGH -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 이메일 인증 API 요청에 사용할 CSRF 정보 -->
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <title>비밀번호 재설정 | 환자낙상예방</title>

  <link rel="stylesheet"
        th:href="@{/css/auth/password-reset.css}"
        href="../../../static/css/auth/password-reset.css">
</head>

<body class="reset-body">
  <main class="reset-page">
    <section class="reset-content" aria-labelledby="hospital-name">

      <header class="reset-header">
        <p class="reset-eyebrow">AI 영상 기반</p>
        <h1 id="hospital-name">늘푸른 요양병원</h1>
        <p class="reset-guide">비밀번호를 잊으셨나요?</p>
      </header>

      <section class="reset-card" aria-labelledby="reset-title">
        <h2 id="reset-title">비밀번호 재설정</h2>

        <form class="reset-form"
              action="/password/reset"
              th:action="@{/password/reset}"
              method="post"
              novalidate>

          <!-- 1단계: 사용자 본인 확인 -->
          <div id="identifySection">
            <p class="reset-description">
              아이디와 이름, 이메일을 확인한 후 인증코드를 보내드립니다.
            </p>

            <div class="reset-field">
              <label for="employeeId">아이디</label>

              <div class="id-check-row">
                <input id="employeeId"
                       type="text"
                       class="id-input"
                       autocomplete="username"
                       placeholder="아이디를 입력해 주세요."
                       maxlength="20">

                <button type="button"
                        id="checkIdBtn"
                        class="id-check-button">
                  확인
                </button>
              </div>

              <p id="idMessage"
                 class="id-check-message"
                 role="status"></p>
            </div>

            <div class="reset-field">
              <label for="employeeName">이름</label>

              <input id="employeeName"
                     type="text"
                     autocomplete="name"
                     placeholder="가입 시 등록한 이름을 입력해 주세요."
                     maxlength="20">
            </div>

            <div class="reset-field">
              <label for="email">이메일</label>

              <div class="id-check-row">
                <input id="email"
                       type="email"
                       class="id-input"
                       autocomplete="email"
                       placeholder="가입 시 등록한 이메일을 입력해 주세요."
                       maxlength="100">

                <button type="button"
                        id="sendCodeBtn"
                        class="id-check-button">
                  인증번호 발송
                </button>
              </div>

              <p id="identityMessage"
                 class="id-check-message"
                 role="status"></p>
            </div>

            <!-- 인증번호 발송에 성공하면 JavaScript가 표시 -->
            <div class="reset-field"
                 id="verifyCodeField"
                 hidden>

              <label for="verifyCode">인증코드</label>

              <div class="id-check-row">
                <input id="verifyCode"
                       type="text"
                       inputmode="numeric"
                       class="id-input"
                       maxlength="6"
                       placeholder="6자리 숫자를 입력해 주세요.">

                <button type="button"
                        id="checkCodeBtn"
                        class="id-check-button">
                  인증 확인
                </button>

                <span id="codeTimer"
                      class="code-timer"></span>
              </div>

              <p id="codeMessage"
                 class="id-check-message"
                 role="status"></p>
            </div>
          </div>

          <!-- 2단계: 이메일 인증 성공 후 JavaScript가 표시 -->
          <div id="newPasswordSection" hidden>
            <p class="reset-description">
              본인 확인이 완료되었습니다. 새 비밀번호를 설정해 주세요.
            </p>

            <div class="reset-field">
              <label for="newPassword">새 비밀번호</label>

              <div class="password-input-wrap">
                <input id="newPassword"
                       name="newPassword"
                       type="password"
                       autocomplete="new-password"
                       minlength="8"
                       maxlength="32"
                       pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                       placeholder="영문, 숫자 포함 8자 이상"
                       aria-describedby="password-rules"
                       required>

                <button class="password-toggle"
                        type="button"
                        aria-label="새 비밀번호 표시"
                        aria-controls="newPassword"
                        aria-pressed="false">

                  <svg viewBox="0 0 24 24"
                       aria-hidden="true"
                       focusable="false">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path class="eye-slash" d="M3 3 21 21"/>
                  </svg>
                </button>
              </div>

              <div id="password-rules"
                   class="password-feedback">
                <span id="rule-letter"
                      class="validation-item">
                  영문 포함
                </span>

                <span id="rule-number"
                      class="validation-item">
                  숫자 포함
                </span>

                <span id="rule-length"
                      class="validation-item">
                  8자 이상
                </span>
              </div>
            </div>

            <div class="reset-field">
              <label for="passwordConfirm">새 비밀번호 확인</label>

              <div class="password-input-wrap">
                <input id="passwordConfirm"
                       name="passwordConfirm"
                       type="password"
                       autocomplete="new-password"
                       placeholder="비밀번호를 한 번 더 입력해 주세요."
                       aria-describedby="password-match"
                       required>

                <button class="password-toggle"
                        type="button"
                        aria-label="새 비밀번호 확인 표시"
                        aria-controls="passwordConfirm"
                        aria-pressed="false">

                  <svg viewBox="0 0 24 24"
                       aria-hidden="true"
                       focusable="false">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path class="eye-slash" d="M3 3 21 21"/>
                  </svg>
                </button>
              </div>

              <div class="password-feedback"
                   aria-live="polite">
                <span id="password-match"
                      class="validation-item">
                  새 비밀번호와 일치하는지 확인해 주세요.
                </span>
              </div>
            </div>

            <button class="reset-submit"
                    type="submit">
              비밀번호 재설정하기
            </button>
          </div>
        </form>

        <p class="reset-detail">
          아이디 또는 이름이 기억나지 않으면 소속 병동 관리자에게 문의해 주세요.
        </p>

        <p class="reset-login">
          <a href="/login"
             th:href="@{/login}">
            로그인으로 돌아가기
          </a>
        </p>
      </section>
    </section>
  </main>

  <!-- 비밀번호 규칙·일치 확인 -->
  <script th:src="@{/JS/password-rest/Password_check.js}"
          src="../../../static/JS/password-rest/Password_check.js"></script>

  <!-- 아이디·이메일·인증번호 확인 -->
  <script th:src="@{/JS/password-rest/password-reset-verify.js}"
          src="../../../static/JS/password-rest/password-reset-verify.js"></script>
</body>
</html>
