<!-- PGH -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 변경 | 환자낙상예방</title>
  <!-- 비밀번호 변경 전용 스타일 -->
  <link rel="stylesheet" href="../../../static/css/auth/password-change.css" th:href="@{/css/auth/password-change.css}">
</head>
<body class="change-body">
  <main class="change-page">
    <section class="change-content" aria-labelledby="change-title">
      <header class="change-header">
        <p class="change-eyebrow">계정 보안</p>
        <h1 id="change-title">비밀번호 변경</h1>
        <p class="change-guide">현재 비밀번호를 확인한 후 새 비밀번호를 저장합니다.</p>
      </header>

      <section class="change-card" aria-labelledby="change-form-title">
        <h2 id="change-form-title">새 비밀번호 설정</h2>
        <p class="change-description">영문과 숫자를 포함하여 8자 이상 입력해 주세요.</p>

        <!-- FlashAttribute passwordChanged가 있을 때 한 번만 성공 메시지를 보여준다. -->
        <div class="change-status is-success" th:if="${passwordChanged}" hidden th:hidden="${passwordChanged == null or !passwordChanged}" role="status">비밀번호가 변경되었습니다.</div>
        <!-- 사용자 조회 자체가 실패한 경우 Controller가 userError를 Model에 넣는다. -->
        <div class="change-status is-error" th:if="${userError}" th:text="${userError}" role="alert"></div>

        <!--
          th:object는 Model의 passwordChangeForm DTO를 이 form의 기준 객체로 지정한다.
          th:action은 Context Path가 있더라도 올바른 POST URL을 만들어 준다.
          Thymeleaf와 Spring Security가 함께 동작하면 CSRF 토큰 hidden input이 자동 추가된다.
          novalidate는 브라우저 기본 메시지 대신 서버 Bean Validation 메시지를 일관되게 보여주기 위함이다.
        -->
        <form class="change-form" th:action="@{/user/password}" th:object="${passwordChangeForm}" method="post" novalidate>
          <div class="change-field">
            <label for="currentPassword">현재 비밀번호</label>
            <!-- th:field="*{currentPassword}"는 DTO의 currentPassword 필드와 양방향 연결한다. -->
            <div class="password-input-wrap">
              <input id="currentPassword" th:field="*{currentPassword}" type="password"
                     autocomplete="current-password" placeholder="현재 비밀번호를 입력해 주세요." required>
              <button class="password-toggle" type="button" aria-label="현재 비밀번호 표시"
                      aria-controls="currentPassword" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>
            <!-- 해당 필드에 검증 오류가 있을 때만 <p>를 만들고 오류 메시지를 출력한다. -->
            <p class="field-error" th:if="${#fields.hasErrors('currentPassword')}"
               th:errors="*{currentPassword}" role="alert"></p>
          </div>
          <div class="change-field">
            <label for="newPassword">새 비밀번호</label>
            <div class="password-input-wrap">
              <input id="newPassword" th:field="*{newPassword}" type="password" autocomplete="new-password"
                     minlength="8" maxlength="32" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                     placeholder="영문, 숫자 포함 8자 이상" aria-describedby="password-rules" required>
              <button class="password-toggle" type="button" aria-label="새 비밀번호 표시"
                      aria-controls="newPassword" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>
            <div id="password-rules" class="password-feedback">
              <span id="rule-letter" class="validation-item">영문 포함</span>
              <span id="rule-number" class="validation-item">숫자 포함</span>
              <span id="rule-length" class="validation-item">8자 이상</span>
            </div>
            <p class="field-error" th:if="${#fields.hasErrors('newPassword')}"
               th:errors="*{newPassword}" role="alert"></p>
            <!-- DTO의 isPasswordByteLengthValid()가 false일 때 표시되는 객체 검증 오류다. -->
            <p class="field-error" th:if="${#fields.hasErrors('passwordByteLengthValid')}"
               th:errors="*{passwordByteLengthValid}" role="alert"></p>
          </div>
          <div class="change-field">
            <label for="passwordConfirm">새 비밀번호 확인</label>
            <div class="password-input-wrap">
              <input id="passwordConfirm" th:field="*{passwordConfirm}" type="password"
                     autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력해 주세요."
                     aria-describedby="password-match" required>
              <button class="password-toggle" type="button" aria-label="새 비밀번호 확인 표시"
                      aria-controls="passwordConfirm" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>
            <div class="password-feedback" aria-live="polite">
              <span id="password-match" class="validation-item">새 비밀번호와 일치하는지 확인해 주세요.</span>
            </div>
            <p class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}"
               th:errors="*{passwordConfirm}" role="alert"></p>
            <!-- DTO의 isPasswordMatching()이 두 PW 입력값을 비교한다. -->
            <p class="field-error" th:if="${#fields.hasErrors('passwordMatching')}"
               th:errors="*{passwordMatching}" role="alert"></p>
          </div>
          <button class="change-submit" type="submit">비밀번호 변경하기</button>
        </form>
        <p class="change-login"><a th:href="@{/dashboard}" href="../dashboard.html">대시보드로 돌아가기</a></p>
      </section>
    </section>
  </main>
  <script th:src="@{/JS/password-change/password-change.js}"
          src="../../../static/JS/password-change/password-change.js"></script>
</body>
</html>
