<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 이메일 인증 요청에 사용할 CSRF 토큰 -->
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">

  <title>회원가입 | 늘푸른요양병원</title>

  <link rel="stylesheet"
        href="../../../static/css/auth/signup.css?v=20260910a"
        th:href="@{/css/auth/signup.css(v=20260910a)}">
</head>

<body class="signup-body">
  <main class="signup-page">
    <section class="signup-card" aria-labelledby="signup-title">

      <header class="signup-header">
        <h1 id="signup-title">회원가입</h1>
        <p>직원 정보를 입력해 계정을 생성해 주세요.</p>
      </header>

      <form class="signup-form"
            action="/signup"
            th:action="@{/signup}"
            method="post">

        <!-- 이름 -->
        <div class="signup-field name-field">
          <label for="name">이름</label>

          <input id="name"
                 name="name"
                 type="text"
                 autocomplete="name"
                 placeholder="이름을 입력해 주세요."
                 required>
        </div>

        <!-- 담당 병동 -->
        <div class="signup-field ward-field">
          <label for="wardId">담당 병동</label>

          <select id="wardId" name="wardId" required>
            <option value="" disabled selected>병동을 선택해 주세요.</option>
            <option value="A">A병동</option>
            <option value="B">B병동</option>
            <option value="C">C병동</option>
            <option value="D">D병동</option>
            <option value="E">E병동</option>
            <option value="F">F병동</option>
          </select>
        </div>

        <!-- 아이디 -->
        <div class="signup-field username-field full-width">
          <label for="username">아이디</label>

          <div class="username-check-row">
            <input id="username"
                   name="username"
                   type="text"
                   autocomplete="username"
                   autocapitalize="none"
                   spellcheck="false"
                   placeholder="아이디를 입력하세요."
                   required>

            <button type="button"
                    id="checkUsernameBtn"
                    class="username-check-btn">
              중복확인
            </button>
          </div>

          <p id="usernameMessage"
             class="username-message"
             role="status"></p>

          <input type="hidden"
                 id="usernameChecked"
                 name="usernameChecked"
                 value="false">
        </div>

        <!-- 이메일 -->
        <div class="signup-field email-field full-width"
             data-send-url="/email/send-code"
             data-verify-url="/email/verify-code"
             th:attr="data-send-url=@{/email/send-code},data-verify-url=@{/email/verify-code}">

          <label for="emailLocal">이메일</label>

          <div class="email-input-row">
            <input id="emailLocal"
                   name="emailLocal"
                   type="text"
                   autocomplete="off"
                   autocapitalize="none"
                   spellcheck="false"
                   placeholder="이메일 아이디"
                   required>

            <span class="email-at" aria-hidden="true">@</span>

            <input id="emailDomainCustom"
                   name="emailDomainCustom"
                   type="text"
                   autocomplete="off"
                   autocapitalize="none"
                   spellcheck="false"
                   placeholder="도메인을 입력하세요."
                   class="email-domain-custom"
                   style="display: none;">

            <select id="emailDomainSelect"
                    name="emailDomainSelect"
                    required>
              <option value="" disabled selected>도메인 선택</option>
              <option value="naver.com">naver.com</option>
              <option value="gmail.com">gmail.com</option>
              <option value="daum.net">daum.net</option>
              <option value="hanmail.net">hanmail.net</option>
              <option value="nate.com">nate.com</option>
              <option value="direct">직접 입력</option>
            </select>

            <button type="button"
                    id="sendCodeBtn"
                    class="username-check-btn">
              인증번호 발송
            </button>
          </div>

          <!-- 조합된 이메일 주소 -->
          <input type="hidden" id="email" name="email">

          <!-- 발송 성공 후 표시 -->
          <div class="verify-code-row"
               id="verifyCodeRow"
               style="display: none;">

            <input id="verifyCode"
                   name="verifyCode"
                   type="text"
                   inputmode="numeric"
                   autocomplete="one-time-code"
                   aria-label="이메일 인증번호"
                   maxlength="6"
                   placeholder="인증번호 6자리">

            <button type="button"
                    id="checkCodeBtn"
                    class="username-check-btn"
                    disabled>
              인증 확인
            </button>

            <span id="codeTimer" class="code-timer"></span>
          </div>
            <p id="emailMessage"
             class="username-message"
             role="status"></p>


          <input type="hidden"
                 id="emailVerified"
                 name="emailVerified"
                 value="false">
        </div>

        <!-- 비밀번호 -->
        <div class="signup-field password-field">
          <label for="password">비밀번호</label>

          <div class="password-input-wrap">
            <input id="password"
                   name="password"
                   type="password"
                   autocomplete="new-password"
                   minlength="8"
                   pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                   title="영문과 숫자를 포함해 8자 이상 입력해 주세요."
                   placeholder="영문, 숫자 포함 8자 이상"
                   aria-describedby="password-rules"
                   required>

            <button class="password-toggle"
                    type="button"
                    aria-label="비밀번호 표시"
                    aria-controls="password"
                    aria-pressed="false">
              <svg viewBox="0 0 24 24"
                   aria-hidden="true"
                   focusable="false">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
                <path class="eye-slash" d="M3 3 21 21"/>
              </svg>
            </button>
          </div>

          <div id="password-rules" class="password-feedback">
            <span id="rule-letter" class="validation-item">영문 포함</span>
            <span id="rule-number" class="validation-item">숫자 포함</span>
            <span id="rule-length" class="validation-item">8자 이상</span>
          </div>
        </div>

        <!-- 비밀번호 확인 -->
        <div class="signup-field confirm-field">
          <label for="passwordConfirm">비밀번호 확인</label>

          <div class="password-input-wrap">
            <input id="passwordConfirm"
                   name="passwordConfirm"
                   type="password"
                   autocomplete="new-password"
                   minlength="8"
                   placeholder="비밀번호를 한 번 더 입력해 주세요."
                   aria-describedby="password-match"
                   required>

            <button class="password-toggle"
                    type="button"
                    aria-label="비밀번호 확인 표시"
                    aria-controls="passwordConfirm"
                    aria-pressed="false">
              <svg viewBox="0 0 24 24"
                   aria-hidden="true"
                   focusable="false">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
                <path class="eye-slash" d="M3 3 21 21"/>
              </svg>
            </button>
          </div>

          <div class="password-feedback" aria-live="polite">
            <span id="password-match" class="validation-item">
              새 비밀번호와 일치하는지 확인해 주세요.
            </span>
          </div>
        </div>

        <button class="signup-submit full-width" type="submit">
          가입하기
        </button>

        <p class="signup-login full-width">
          이미 계정이 있으신가요?
          <a href="login.html" th:href="@{/login}">로그인</a>
        </p>
      </form>

    </section>
  </main>

  <!-- 아이디 중복확인 -->
  <script src="../../../static/JS/auth/ID_check.js"
          th:src="@{/JS/auth/ID_check.js}"></script>

  <!-- 비밀번호 확인 -->
  <script src="../../../static/JS/auth/Password_check.js"
          th:src="@{/JS/auth/Password_check.js}"></script>
</body>
</html>
