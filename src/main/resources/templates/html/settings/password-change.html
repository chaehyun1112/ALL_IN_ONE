<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>비밀번호 변경 | 환자낙상예방</title>
  <link rel="stylesheet"
        href="../../../static/css/settings/password-change.css"
        th:href="@{/css/settings/password-change.css}">
</head>
<body class="change-body">
  <main class="change-page">
    <section class="change-content" aria-labelledby="change-title">
      <header class="change-header">
        <p class="change-eyebrow">계정 보안</p>
        <h1 id="change-title">비밀번호 변경</h1>
        <p class="change-guide"
           th:text="${initialPasswordChange}
             ? '임시 비밀번호를 확인한 후 새 비밀번호를 저장합니다.'
             : '현재 비밀번호를 확인한 후 새 비밀번호를 저장합니다.'">
          현재 비밀번호를 확인한 후 새 비밀번호를 저장합니다.
        </p>
      </header>

      <section class="change-card" aria-labelledby="change-form-title">
        <h2 id="change-form-title">새 비밀번호 설정</h2>
        <p class="change-description">
          영문과 숫자를 포함하여 8자 이상 입력해 주세요.
        </p>

        <div class="change-status is-success"
             th:if="${passwordChanged}"
             hidden
             th:hidden="${passwordChanged == null or !passwordChanged}"
             role="status">
          비밀번호가 변경되었습니다.
        </div>

        <div class="change-status is-error"
             th:if="${userError}"
             th:text="${userError}"
             role="alert">
        </div>

        <form class="change-form"
              th:action="@{/user/password}"
              th:object="${passwordChangeForm}"
              method="post"
              novalidate>

          <div class="change-field">
            <label for="currentPassword"
                   th:text="${initialPasswordChange}
                     ? '임시 비밀번호'
                     : '현재 비밀번호'">
              현재 비밀번호
            </label>

            <div class="initial-password-row"
                 th:classappend="${!initialPasswordChange} ? ' no-verify'">
              <div class="password-input-wrap">
                <input id="currentPassword"
                       th:field="*{currentPassword}"
                       type="password"
                       name="currentPassword"
                       autocomplete="current-password"
                       th:placeholder="${initialPasswordChange}
                         ? '임시 비밀번호를 입력해 주세요.'
                         : '현재 비밀번호를 입력해 주세요.'"
                       placeholder="현재 비밀번호를 입력해 주세요."
                       aria-describedby="initial-password-result"
                       required>

                <button class="password-toggle"
                        type="button"
                        aria-label="현재 비밀번호 표시"
                        aria-controls="currentPassword"
                        aria-pressed="false">
                  <svg viewBox="0 0 24 24"
                       aria-hidden="true"
                       focusable="false">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path class="eye-slash" d="M3 3 21 21"/>
                  </svg>
                </button>
              </div>

              <button id="verify-initial-password"
                      class="password-verify"
                      type="button"
                      th:if="${initialPasswordChange}"
                      data-verify-url="/user/password/verify"
                      th:data-verify-url="@{/user/password/verify}">
                임시 비밀번호 확인
              </button>
            </div>

            <p id="initial-password-result"
               class="initial-password-result"
               th:if="${initialPasswordChange}"
               role="status"
               aria-live="polite"
               hidden>
            </p>

            <p class="field-error"
               th:if="${#fields.hasErrors('currentPassword')}"
               th:errors="*{currentPassword}"
               role="alert">
            </p>
          </div>

          <div class="change-field">
            <label for="newPassword">새 비밀번호</label>

            <div class="password-input-wrap">
              <input id="newPassword"
                     th:field="*{newPassword}"
                     type="password"
                     autocomplete="new-password"
                     minlength="8"
                     maxlength="32"
                     pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"
                     placeholder="영문, 숫자 포함 8자 이상"
                     aria-describedby="password-rules"
                     required>

              <button class="password-toggle"
                      type="button"
                      aria-label="새 비밀번호 표시"
                      aria-controls="newPassword"
                      aria-pressed="false">
                <svg viewBox="0 0 24 24"
                     aria-hidden="true"
                     focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>

            <div id="password-rules" class="password-feedback">
              <span id="rule-letter" class="validation-item">영문 포함</span>
              <span id="rule-number" class="validation-item">숫자 포함</span>
              <span id="rule-length" class="validation-item">8자 이상</span>
            </div>

            <p class="field-error"
               th:if="${#fields.hasErrors('newPassword')}"
               th:errors="*{newPassword}"
               role="alert">
            </p>

            <p class="field-error"
               th:if="${#fields.hasErrors('passwordByteLengthValid')}"
               th:errors="*{passwordByteLengthValid}"
               role="alert">
            </p>
          </div>

          <div class="change-field">
            <label for="passwordConfirm">새 비밀번호 확인</label>

            <div class="password-input-wrap">
              <input id="passwordConfirm"
                     th:field="*{passwordConfirm}"
                     type="password"
                     autocomplete="new-password"
                     placeholder="비밀번호를 한 번 더 입력해 주세요."
                     aria-describedby="password-match"
                     required>

              <button class="password-toggle"
                      type="button"
                      aria-label="새 비밀번호 확인 표시"
                      aria-controls="passwordConfirm"
                      aria-pressed="false">
                <svg viewBox="0 0 24 24"
                     aria-hidden="true"
                     focusable="false">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                  <path class="eye-slash" d="M3 3 21 21"/>
                </svg>
              </button>
            </div>

            <div class="password-feedback" aria-live="polite">
              <span id="password-match" class="validation-item">
                새 비밀번호와 일치하는지 확인해 주세요.
              </span>
            </div>

            <p class="field-error"
               th:if="${#fields.hasErrors('passwordConfirm')}"
               th:errors="*{passwordConfirm}"
               role="alert">
            </p>

            <p class="field-error"
               th:if="${#fields.hasErrors('passwordMatching')}"
               th:errors="*{passwordMatching}"
               role="alert">
            </p>
          </div>

          <button class="change-submit" type="submit">
            비밀번호 변경하기
          </button>
        </form>

        <p class="change-login">
          <a th:href="@{/dashboard}"
             href="../dashboard/dashboard.html">
            대시보드로 돌아가기
          </a>
        </p>
      </section>
    </section>
  </main>

  <script th:src="@{/JS/settings/password-change.js}"
          src="../../../static/JS/settings/password-change.js"></script>
</body>
</html>
