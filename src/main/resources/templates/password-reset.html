<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 재설정 | 늘푸른요양병원</title>
  <link rel="stylesheet" href="../static/password-reset.css" th:href="@{/password-reset.css}">
</head>
<body>
  <main class="reset-page">
    <section class="reset-content" aria-labelledby="hospital-name">
      <header class="service-intro">
        <p class="service-eyebrow">AI 영상 기반</p>
        <h1 id="hospital-name">늘푸른요양병원</h1>
        <p class="service-description">아이디 확인이 완료되었습니다. 새 비밀번호를 설정하세요.</p>
      </header>
      <section class="reset-card" aria-labelledby="reset-title">
        <h2 id="reset-title">비밀번호 재설정</h2>
        <p class="card-description">새 비밀번호를 입력하고 한 번 더 확인해 주세요.</p>
        <form action="/password/reset" th:action="@{/password/reset}" method="post">
          <div class="field">
            <label for="new-password">새 비밀번호</label>
            <input id="new-password" name="newPassword" type="password" autocomplete="new-password" placeholder="영문, 숫자 포함 8자 이상" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" title="영문과 숫자를 포함하여 8자 이상 입력해 주세요." required>
          </div>
          <div class="field confirm-field">
            <label for="password-confirm">비밀번호 확인</label>
            <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력해 주세요." required>
          </div>
          <button type="submit">비밀번호 변경하기</button>
          <p class="login-link"><a href="login.html" th:href="@{/login}">로그인으로 돌아가기</a></p>
        </form>
      </section>
    </section>
  </main>
  <script>
    const password = document.getElementById('new-password');
    const confirmation = document.getElementById('password-confirm');
    function validateConfirmation() {
      confirmation.setCustomValidity(confirmation.value && confirmation.value !== password.value
        ? '비밀번호가 일치하지 않습니다.' : '');
    }
    password.addEventListener('input', validateConfirmation);
    confirmation.addEventListener('input', validateConfirmation);
  </script>
</body>
</html>
